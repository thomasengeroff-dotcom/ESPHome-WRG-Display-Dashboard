# ---------------------------------------------------------
# LVGL User Interface Configuration (landscape 820 x 320)
#   page_main   - Übersicht per room: up to 3 unit cards per page (more pages per room as
#                 needed), room mode and Automatik-Status of the room master
#   page_wrg    - Wärmerückgewinnung: NTC temperatures, efficiency, presence, room inputs
#   page_system - Raumklima (local BME680) and a table of all units
#   page_detail - one unit: current values, 24 h chart, room mode / level controls
#                 (packages/ui_page_detail.yaml, opened by tapping a card)
# Tap the background to switch pages (room pages, then WRG, System); after 60 s without
# touch the first room page returns.
# ---------------------------------------------------------

font:
  # Text fonts: Latin kernel plus German umlauts (the default glyph set has none)
  - file: "gfonts://Roboto"
    id: font_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "äöüÄÖÜß·»–"
  - file: "gfonts://Roboto"
    id: font_22
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "äöüÄÖÜß·»–"
  - file: "gfonts://Roboto"
    id: font_28
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "äöüÄÖÜß·»–"
  # Number fonts: only the glyphs they show, to save flash
  - file: "gfonts://Roboto"
    id: font_40
    size: 40
    bpp: 4
    glyphs: "0123456789:-"
  - file: "gfonts://Roboto"
    id: font_48
    size: 48
    bpp: 4
    glyphs: "0123456789.,-+°C% "
  - file: "gfonts://Roboto@500"
    id: font_72
    size: 72
    bpp: 4
    glyphs: "0123456789-Aus"
  # Material Design Icons (code points also in dashboard.h)
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_32
    size: 32
    bpp: 4
    glyphs:
      - "\U000F0210" # fan
      - "\U000F081D" # fan-off
      - "\U000F0319" # lan-disconnect
      - "\U000F07D0" # home-assistant
      - "\U000F0004" # account
      - "\U000F0012" # account-off
      - "\U000F0141" # chevron-left
      - "\U000F0374" # minus
      - "\U000F0415" # plus
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_56
    size: 56
    bpp: 4
    glyphs:
      - "\U000F0F9C" # home-import-outline (Zuluft)
      - "\U000F0F9B" # home-export-outline (Abluft)

lvgl:
  id: my_lvgl
  log_level: WARN
  # Landscape 820x320. Must be set here, not on the display (LVGL rejects display rotation).
  rotation: 90

  # Colours: keep in sync with dash::COL_* in dashboard.h.
  # Text colour/font are set on the containers (screen, card, row, button) and inherited
  # by their labels - a label theme would override the button's own (checked) text style.
  style_definitions:
    - id: screen_style
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      text_color: 0xFFFFFF
      text_font: font_22
    # Invisible layout container (flex rows of labels whose width changes at runtime)
    - id: bare_style
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 0
      text_color: 0xFFFFFF
    # No borders: the panel renders dark greys as bright cyan lines
    - id: card_style
      bg_color: 0x12171E
      bg_opa: COVER
      border_width: 0
      radius: 14
      pad_all: 12
      text_color: 0xFFFFFF
    - id: row_style
      bg_color: 0x12171E
      bg_opa: COVER
      border_width: 0
      radius: 10
      pad_left: 14
      pad_right: 14
      pad_top: 0
      pad_bottom: 0
      text_color: 0xFFFFFF
    - id: button_style
      bg_color: 0x252D38
      bg_opa: COVER
      border_width: 0
      radius: 10
      shadow_width: 0
      pad_all: 0
      text_color: 0xFFFFFF
      text_font: font_18
      bg_grad_dir: NONE

  on_idle:
    - timeout: 60s
      then:
        - lambda: |-
            dash::detail_open = false;
            dash::overview_page = 0;
        - script.execute: refresh_overview
        - lvgl.page.show: page_main

  pages:
    # =====================================================
    # Page 1: Übersicht
    # =====================================================
    - id: page_main
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: screen_style
            scrollable: false
            on_click:
              # Next page of this / the next room; after the last room page_wrg follows.
              # No page animation: with software rotation every animation frame is a full redraw.
              - if:
                  condition:
                    lambda: 'return dash::overview_next();'
                  then:
                    - script.execute: refresh_overview
                  else:
                    - lvgl.page.show: page_wrg
            widgets:
              # Header: time | room (+ page within the room) | room mode, HA connection
              # Flex rows: neighbours follow labels whose width changes at runtime
              - obj:
                  x: 12
                  y: 6
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: bare_style
                  clickable: false
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: END
                    pad_column: 10
                  widgets:
                    - label:
                        id: label_time
                        text: "--:--"
                        text_font: font_40
                    - label:
                        id: label_date
                        pad_bottom: 6
                        text: ""
                        text_font: font_18
                        text_color: 0xA9B4C0
              - obj:
                  align: TOP_MID
                  y: 10
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: bare_style
                  clickable: false
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: END
                    pad_column: 10
                  widgets:
                    - label:
                        id: label_room
                        text: "--"
                        text_font: font_28
                    - label:
                        id: label_room_page
                        pad_bottom: 3
                        text: ""
                        text_font: font_18
                        text_color: 0xA9B4C0
              - obj:
                  align: TOP_RIGHT
                  x: -12
                  y: 10
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: bare_style
                  clickable: false
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    pad_column: 10
                  widgets:
                    - label:
                        id: label_mode
                        text: "--"
                        text_font: font_22
                        text_color: 0x2DD4BF
                    - label:
                        id: label_ha
                        text: "\U000F07D0"
                        text_font: font_icon_32
                        text_color: 0xA9B4C0

              # Card slots, filled with the units of the current room page
              - !include { file: packages/ui_device_card.yaml, vars: { slot: 0 } }
              - !include { file: packages/ui_device_card.yaml, vars: { slot: 1 } }
              - !include { file: packages/ui_device_card.yaml, vars: { slot: 2 } }

              # Footer: Smart-Automatik status of the room | local climate | page counter
              - label:
                  id: label_auto_status
                  align: BOTTOM_LEFT
                  x: 14
                  y: -16
                  width: 540
                  long_mode: DOT
                  text: ""
                  text_font: font_22
                  text_color: 0xA9B4C0
              - label:
                  id: label_local_summary
                  align: BOTTOM_RIGHT
                  x: -70
                  y: -18
                  text: ""
                  text_font: font_18
              - label:
                  id: label_counter_main
                  align: BOTTOM_RIGHT
                  x: -14
                  y: -18
                  text: ""
                  text_font: font_18
                  text_color: 0xA9B4C0

    # =====================================================
    # Page 2: Wärmerückgewinnung (sensors of the Wohnraum unit)
    # =====================================================
    - id: page_wrg
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: screen_style
            scrollable: false
            on_click:
              # No page animation: with software rotation every animation frame is a full redraw.
              - lvgl.page.show: page_system
            widgets:
              - label:
                  x: 14
                  y: 12
                  text: "Wärmerückgewinnung · Wohnraum"
                  text_font: font_28
              - label:
                  align: TOP_RIGHT
                  x: -14
                  y: 18
                  id: label_counter_wrg
                  text: ""
                  text_font: font_18
                  text_color: 0xA9B4C0

              # Temperatures and efficiency
              - obj:
                  x: 8
                  y: 58
                  width: 196
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Außenluft"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_wrg_outdoor
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0x38BDF8
              - obj:
                  x: 212
                  y: 58
                  width: 196
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Zuluft nach WRG"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_wrg_supply
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0x2DD4BF
              - obj:
                  x: 416
                  y: 58
                  width: 196
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Raumluft (Abluft)"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_wrg_indoor
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0xF59E0B
              - obj:
                  x: 620
                  y: 58
                  width: 192
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "WRG-Effizienz"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_wrg_efficiency
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0x22C55E

              # Room inputs
              - obj:
                  x: 8
                  y: 208
                  width: 262
                  height: 102
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Anwesenheit (Radar)"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_presence_icon
                        align: BOTTOM_LEFT
                        text: "\U000F0012"
                        text_font: font_icon_32
                        text_color: 0xA9B4C0
                    - label:
                        id: label_presence
                        align: BOTTOM_LEFT
                        x: 42
                        y: -4
                        text: "--"
                        text_font: font_22
              - obj:
                  x: 279
                  y: 208
                  width: 262
                  height: 102
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Klima-Koordination"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_climate_coord
                        align: BOTTOM_LEFT
                        y: -4
                        width: 236
                        long_mode: DOT
                        text: "--"
                        text_font: font_22
              - obj:
                  x: 550
                  y: 208
                  width: 262
                  height: 102
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Fenstersperre"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_window_lock
                        align: BOTTOM_LEFT
                        y: -4
                        text: "--"
                        text_font: font_22

    # =====================================================
    # Page 3: Raumklima am Display & System
    # =====================================================
    - id: page_system
      bg_color: 0x000000
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: screen_style
            scrollable: false
            on_click:
              # Back to the first room page
              - lambda: 'dash::overview_page = 0;'
              - script.execute: refresh_overview
              - lvgl.page.show: page_main
            widgets:
              - label:
                  x: 14
                  y: 12
                  text: "Raumklima am Display · System"
                  text_font: font_28
              - label:
                  align: TOP_RIGHT
                  x: -14
                  y: 18
                  id: label_counter_system
                  text: ""
                  text_font: font_18
                  text_color: 0xA9B4C0

              # Local BME680
              - obj:
                  x: 8
                  y: 50
                  width: 196
                  height: 76
                  styles: card_style
                  pad_all: 10
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Temperatur"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_local_temp
                        align: BOTTOM_LEFT
                        text: "-- °C"
                        text_font: font_28
              - obj:
                  x: 212
                  y: 50
                  width: 196
                  height: 76
                  styles: card_style
                  pad_all: 10
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Luftfeuchte"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_local_hum
                        align: BOTTOM_LEFT
                        text: "-- %"
                        text_font: font_28
                        text_color: 0x38BDF8
              - obj:
                  x: 416
                  y: 50
                  width: 196
                  height: 76
                  styles: card_style
                  pad_all: 10
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "IAQ (BME680)"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_local_iaq
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_28
                        text_color: 0x2DD4BF
              - obj:
                  x: 620
                  y: 50
                  width: 192
                  height: 76
                  styles: card_style
                  pad_all: 10
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Luftdruck"
                        text_font: font_18
                        text_color: 0xA9B4C0
                    - label:
                        id: label_local_pres
                        align: BOTTOM_LEFT
                        text: "-- hPa"
                        text_font: font_28

              # All units (rows filled by dash::refresh_system_table, scrolls with many units)
              - table:
                  id: system_table
                  x: 8
                  y: 134
                  width: 804
                  height: 178
                  bg_color: 0x12171E
                  bg_opa: COVER
                  border_width: 0
                  radius: 10
                  pad_all: 0
                  text_font: font_18
                  text_color: 0xFFFFFF
                  columns:
                    - width: 170
                    - width: 170
                    - width: 200
                    - width: 120
                    - width: 140
                  rows:
                    - cells: ["Gerät", "Raum", "Konfiguration", "WLAN", "Version"]
                  items:
                    bg_opa: TRANSP
                    border_width: 0
                    pad_top: 6
                    pad_bottom: 6
                    pad_left: 14
                    text_color: 0xFFFFFF

    # =====================================================
    # Page 4: Detail of one unit (not part of the page cycle)
    # =====================================================
    - !include packages/ui_page_detail.yaml
