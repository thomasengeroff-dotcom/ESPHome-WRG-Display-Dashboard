# ---------------------------------------------------------
# LVGL User Interface Configuration (landscape 820 x 320)
#   page_main   - Übersicht: one card per VentoSync unit, room mode, Automatik-Status
#   page_wrg    - Wärmerückgewinnung: NTC temperatures, efficiency, presence, room inputs
#   page_system - Raumklima (local BME680) and per-device diagnostics
# Tap anywhere to switch pages; after 60 s without touch the overview returns.
# ---------------------------------------------------------

font:
  # Text fonts: Latin kernel plus German umlauts (the default glyph set has none)
  - file: "gfonts://Roboto"
    id: font_18
    size: 18
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "äöüÄÖÜß·»–"
  - file: "gfonts://Roboto"
    id: font_22
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "äöüÄÖÜß·»–"
  - file: "gfonts://Roboto"
    id: font_28
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Kernel]
    glyphs: "äöüÄÖÜß·»–"
  # Number fonts: only the glyphs they show, to save flash
  - file: "gfonts://Roboto"
    id: font_40
    size: 40
    bpp: 4
    glyphs: "0123456789:-"
  - file: "gfonts://Roboto"
    id: font_48
    size: 48
    bpp: 4
    glyphs: "0123456789.,-+°C% "
  - file: "gfonts://Roboto@500"
    id: font_72
    size: 72
    bpp: 4
    glyphs: "0123456789-Aus"
  # Material Design Icons (code points also in dashboard.h)
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_32
    size: 32
    bpp: 4
    glyphs:
      - "\U000F0210" # fan
      - "\U000F081D" # fan-off
      - "\U000F0319" # lan-disconnect
      - "\U000F07D0" # home-assistant
      - "\U000F0004" # account
      - "\U000F0012" # account-off
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_56
    size: 56
    bpp: 4
    glyphs:
      - "\U000F0F9C" # home-import-outline (Zuluft)
      - "\U000F0F9B" # home-export-outline (Abluft)

lvgl:
  id: my_lvgl
  log_level: WARN
  # Landscape 820x320. Must be set here, not on the display (LVGL rejects display rotation).
  rotation: 90

  # Colours: keep in sync with dash::COL_* in dashboard.h
  theme:
    label:
      text_color: 0xE6EDF3
      text_font: font_22

  style_definitions:
    - id: screen_style
      bg_color: 0x0B0F14
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
    - id: card_style
      bg_color: 0x161B22
      bg_opa: COVER
      border_color: 0x262C36
      border_width: 1
      radius: 14
      pad_all: 12
    - id: row_style
      bg_color: 0x161B22
      bg_opa: COVER
      border_width: 0
      radius: 10
      pad_left: 14
      pad_right: 14
      pad_top: 0
      pad_bottom: 0

  on_idle:
    - timeout: 60s
      then:
        - lvgl.page.show: page_main

  pages:
    # =====================================================
    # Page 1: Übersicht
    # =====================================================
    - id: page_main
      bg_color: 0x0B0F14
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: screen_style
            scrollable: false
            on_click:
              # No page animation: with software rotation every animation frame is a full redraw.
              - lvgl.page.next:
            widgets:
              # Header: time, room mode, local climate, HA connection
              - label:
                  id: label_time
                  x: 12
                  y: 6
                  text: "--:--"
                  text_font: font_40
              - label:
                  id: label_date
                  align_to:
                    id: label_time
                    align: OUT_RIGHT_BOTTOM
                    x: 10
                    y: -6
                  text: ""
                  text_font: font_18
                  text_color: 0x8B949E
              - label:
                  id: label_mode
                  align: TOP_MID
                  x: 10
                  y: 14
                  text: "--"
                  text_font: font_28
                  text_color: 0x2DD4BF
              - label:
                  id: label_local_summary
                  align: TOP_RIGHT
                  x: -52
                  y: 18
                  text: "--"
                  text_font: font_22
              - label:
                  id: label_ha
                  align: TOP_RIGHT
                  x: -12
                  y: 12
                  text: "\U000F07D0"
                  text_font: font_icon_32
                  text_color: 0x8B949E

              # One card per ventilation unit
              - !include
                file: packages/ui_device_card.yaml
                vars: { key: buero, title: "Büro", x: 8 }
              - !include
                file: packages/ui_device_card.yaml
                vars: { key: flur, title: "Flur", x: 279 }
              - !include
                file: packages/ui_device_card.yaml
                vars: { key: wohnraum, title: "Wohnraum", x: 550 }

              # Footer: Smart-Automatik status of the room master
              - label:
                  id: label_auto_status
                  align: BOTTOM_LEFT
                  x: 14
                  y: -16
                  width: 740
                  long_mode: DOT
                  text: "--"
                  text_font: font_22
                  text_color: 0x8B949E
              - label:
                  align: BOTTOM_RIGHT
                  x: -14
                  y: -18
                  text: "1/3"
                  text_font: font_18
                  text_color: 0x8B949E

    # =====================================================
    # Page 2: Wärmerückgewinnung (sensors of the Wohnraum unit)
    # =====================================================
    - id: page_wrg
      bg_color: 0x0B0F14
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: screen_style
            scrollable: false
            on_click:
              # No page animation: with software rotation every animation frame is a full redraw.
              - lvgl.page.next:
            widgets:
              - label:
                  x: 14
                  y: 12
                  text: "Wärmerückgewinnung · Wohnraum"
                  text_font: font_28
              - label:
                  align: TOP_RIGHT
                  x: -14
                  y: 18
                  text: "2/3"
                  text_font: font_18
                  text_color: 0x8B949E

              # Temperatures and efficiency
              - obj:
                  x: 8
                  y: 58
                  width: 196
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Außenluft"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_wrg_outdoor
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0x38BDF8
              - obj:
                  x: 212
                  y: 58
                  width: 196
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Zuluft nach WRG"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_wrg_supply
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0x2DD4BF
              - obj:
                  x: 416
                  y: 58
                  width: 196
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Raumluft (Abluft)"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_wrg_indoor
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0xF59E0B
              - obj:
                  x: 620
                  y: 58
                  width: 192
                  height: 140
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "WRG-Effizienz"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_wrg_efficiency
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_48
                        text_color: 0x22C55E

              # Room inputs
              - obj:
                  x: 8
                  y: 208
                  width: 262
                  height: 102
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Anwesenheit (Radar)"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_presence_icon
                        align: BOTTOM_LEFT
                        text: "\U000F0012"
                        text_font: font_icon_32
                        text_color: 0x8B949E
                    - label:
                        id: label_presence
                        align: BOTTOM_LEFT
                        x: 42
                        y: -4
                        text: "--"
                        text_font: font_22
              - obj:
                  x: 279
                  y: 208
                  width: 262
                  height: 102
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Klima-Koordination"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_climate_coord
                        align: BOTTOM_LEFT
                        y: -4
                        width: 236
                        long_mode: DOT
                        text: "--"
                        text_font: font_22
              - obj:
                  x: 550
                  y: 208
                  width: 262
                  height: 102
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Fenstersperre"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_window_lock
                        align: BOTTOM_LEFT
                        y: -4
                        text: "--"
                        text_font: font_22

    # =====================================================
    # Page 3: Raumklima am Display & System
    # =====================================================
    - id: page_system
      bg_color: 0x0B0F14
      widgets:
        - obj:
            width: 100%
            height: 100%
            styles: screen_style
            scrollable: false
            on_click:
              # No page animation: with software rotation every animation frame is a full redraw.
              - lvgl.page.next:
            widgets:
              - label:
                  x: 14
                  y: 12
                  text: "Raumklima am Display · System"
                  text_font: font_28
              - label:
                  align: TOP_RIGHT
                  x: -14
                  y: 18
                  text: "3/3"
                  text_font: font_18
                  text_color: 0x8B949E

              # Local BME680
              - obj:
                  x: 8
                  y: 54
                  width: 196
                  height: 96
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Temperatur"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_local_temp
                        align: BOTTOM_LEFT
                        text: "-- °C"
                        text_font: font_28
              - obj:
                  x: 212
                  y: 54
                  width: 196
                  height: 96
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Luftfeuchte"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_local_hum
                        align: BOTTOM_LEFT
                        text: "-- %"
                        text_font: font_28
                        text_color: 0x38BDF8
              - obj:
                  x: 416
                  y: 54
                  width: 196
                  height: 96
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "IAQ (BME680)"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_local_iaq
                        align: BOTTOM_LEFT
                        text: "--"
                        text_font: font_28
                        text_color: 0x2DD4BF
              - obj:
                  x: 620
                  y: 54
                  width: 192
                  height: 96
                  styles: card_style
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        text: "Luftdruck"
                        text_font: font_18
                        text_color: 0x8B949E
                    - label:
                        id: label_local_pres
                        align: BOTTOM_LEFT
                        text: "-- hPa"
                        text_font: font_28

              # One diagnostics row per ventilation unit
              - !include
                file: packages/ui_device_row.yaml
                vars: { key: buero, title: "Büro", y: 158 }
              - !include
                file: packages/ui_device_row.yaml
                vars: { key: flur, title: "Flur", y: 214 }
              - !include
                file: packages/ui_device_row.yaml
                vars: { key: wohnraum, title: "Wohnraum", y: 270 }
