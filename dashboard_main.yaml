substitutions:
  device_name: "wrg-dashboard"
  friendly_name: "WRG Dashboard"
  # HA entity prefixes of the VentoSync units shown on the cards
  # (entity ids are e.g. fan.<prefix>_ventosync_hrv, number.<prefix>_lufter_intensitat).
  device_1_prefix: "ventosync_dg_buero"
  device_2_prefix: "ventosync_dg_flur"
  device_3_prefix: "ventosync_dg_wohnraum"
  # Room master (device ID 1): room mode and Smart-Automatik status
  master_prefix: "ventosync_dg_buero"
  master_area_prefix: "arbeitszimmer_ventosync_dg_buero"
  # Unit with NTCs and radar for the Wärmerückgewinnung page
  wrg_prefix: "ventosync_dg_wohnraum"
  wrg_area_prefix: "dachgeschoss_wohnraum_ventosync_dg_wohnraum"

esp32:
  board: esp32-s3-devkitc-1 # Standard S3 DevKit Profile
  flash_size: 16MB # Qualia ESP32-S3 N16R8
  framework:
    type: esp-idf
    version: recommended

# Wichtig für den S3, damit der USB-Port nach dem Flashen aktiv bleibt:
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG


# PSRAM ist zwingend erforderlich für RGB Displays & LVGL
psram:
  mode: octal

# ---------------------------------------------------------
# WIFI CONNECTIVITY
# ---------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Fallback Hotspot:
  # If the configured WiFi is not reachable within 1 minute, the device
  # opens its own Hotspot (Captive Portal) to allow reconfiguration.
  ap:
    ssid: "${device_name} Hotspot"
    password: !secret appw

api:
  max_connections: 8
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# Fetches the 24 h history from the VentoSync units' web dashboard (GET /history)
http_request:
  timeout: 5s
  verify_ssl: false

# ---------------------------------------------------------
# Zeit synchronisation für den Mainscreen
# ---------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"
    on_time_sync:
      - script.execute: refresh_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: refresh_clock

# ---------------------------------------------------------
# BME680 Sensor & PCA9554 (Lokal am Dashboard)
# ---------------------------------------------------------
i2c:
  id: i2c_bus
  sda: GPIO8 # Adafruit Qualia I2C SDA
  scl: GPIO18 # Adafruit Qualia I2C SCL
  scan: true
  frequency: 400kHz

# Custom C++ Init-Routine für das Display über den PCA9554 (I2C)
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - qualia_init.h
    - dashboard.h
    - dashboard_detail.h
  build_flags:
    # lv_chart for the 24 h history on page_detail (not exposed as an ESPHome widget)
    - -DLV_USE_CHART=1

  on_boot:
    priority: 800
    then:
      - lambda: |-
          auto my_init = new esphome::qualia::QualiaDisplayInit();
          // Set the I2C ID and the correct address for the Qualia PCA9554
          my_init->set_i2c_bus(id(i2c_bus));
          my_init->set_i2c_address(0x3F);
          my_init->setup();

bme68x_bsec2_i2c:
  address: 0x77 # Adafruit BME680 Standard
  i2c_id: i2c_bus
  model: bme680

sensor:
  - platform: bme68x_bsec2
    temperature:
      name: "Dashboard Temperatur"
      id: local_temp
      on_value:
        - script.execute: refresh_local
    humidity:
      name: "Dashboard Feuchtigkeit"
      id: local_hum
      on_value:
        - script.execute: refresh_local
    pressure:
      name: "Dashboard Luftdruck"
      id: local_pres
      on_value:
        - lambda: 'dash::set_text(id(label_local_pres), dash::num(x, "%.0f hPa"));'
    iaq:
      name: "Dashboard IAQ"
      id: local_iaq
      on_value:
        - script.execute: refresh_local

  # --- Room controls (room master) ---
  - platform: homeassistant
    id: ha_room_level
    entity_id: number.${master_prefix}_lufter_intensitat
    on_value:
      - lambda: 'if (id(pending_level) == (int) x) id(pending_level) = 0;'
      - script.execute: refresh_controls
  - platform: homeassistant
    id: ha_override_remaining
    entity_id: sensor.${master_area_prefix}_automatik_ubersteuerung_restzeit
    on_value:
      - script.execute: refresh_controls
  - platform: homeassistant
    id: ha_override_duration
    entity_id: number.${master_area_prefix}_smart_automatik_ubersteuerung_dauer
    on_value:
      - script.execute: refresh_controls

  # --- Wärmerückgewinnung (unit with NTCs) ---
  - platform: homeassistant
    id: ha_wrg_outdoor
    entity_id: sensor.${wrg_prefix}_temp_zuluft_aussen
    on_value:
      - lambda: 'dash::set_text(id(label_wrg_outdoor), dash::num(x, "%.1f °C"));'
  - platform: homeassistant
    id: ha_wrg_indoor
    entity_id: sensor.${wrg_prefix}_temp_abluft_innen
    on_value:
      - lambda: 'dash::set_text(id(label_wrg_indoor), dash::num(x, "%.1f °C"));'
  - platform: homeassistant
    id: ha_wrg_supply
    entity_id: sensor.${wrg_area_prefix}_temp_zuluft_nach_wrg
    on_value:
      - lambda: 'dash::set_text(id(label_wrg_supply), dash::num(x, "%.1f °C"));'
  - platform: homeassistant
    id: ha_wrg_efficiency
    entity_id: sensor.${wrg_prefix}_wrg_effizienz
    on_value:
      - lambda: 'dash::set_text(id(label_wrg_efficiency), dash::num(x, "%.0f %%"));'

# ---------------------------------------------------------
# Home Assistant: room-wide states (from the room master)
# ---------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_room_mode
    entity_id: select.${master_prefix}_luftermodus
    on_value:
      - lambda: 'dash::set_text(id(label_mode), dash::text_or(x));'
      - script.execute: refresh_controls
  - platform: homeassistant
    id: ha_auto_status
    entity_id: sensor.${master_area_prefix}_automatik_status
    on_value:
      - lambda: 'dash::set_text(id(label_auto_status), dash::ascii_arrows(dash::text_or(x)));'
  - platform: homeassistant
    id: ha_climate_coord
    entity_id: sensor.${master_area_prefix}_klima_koordination_status
    on_value:
      - lambda: 'dash::set_text(id(label_climate_coord), dash::text_or(x));'
  - platform: homeassistant
    id: ha_window_lock
    entity_id: sensor.${master_prefix}_fenstersperre_aktiv
    on_value:
      - lambda: 'dash::set_text(id(label_window_lock), dash::text_or(x));'

binary_sensor:
  - platform: homeassistant
    id: ha_presence
    entity_id: binary_sensor.${wrg_area_prefix}_radar_anwesenheit
    on_state:
      - lambda: |-
          dash::set_text(id(label_presence), x ? "Anwesend" : "Niemand da");
          dash::set_text(id(label_presence_icon), x ? dash::ICON_PRESENT : dash::ICON_ABSENT);
          dash::set_color(id(label_presence_icon), x ? dash::COL_OK : dash::COL_MUTED);

globals:
  # Level tapped on the display, not yet confirmed by HA (0 = none)
  - id: pending_level
    type: int
    initial_value: "0"

script:
  # ---------------- Detail page ----------------
  - id: open_detail
    then:
      - lambda: |-
          dash::detail_open = true;
          if (dash::history.device != dash::selected)
            dash::history.state = dash::HistoryState::EMPTY;
      - script.execute: refresh_detail
      - script.execute: refresh_controls
      - script.execute: refresh_chart
      - lvgl.page.show: page_detail
      - script.execute: fetch_history
  - id: refresh_detail
    then:
      - lambda: |-
          auto &d = dash::current();
          if (d.fan == nullptr)
            return;
          dash::set_text(id(detail_title), d.title);
          dash::set_text(id(detail_info), dash::device_info(d));
          dash::refresh_card(
              {dash::obj(id(detail_status)), dash::obj(id(detail_card_name)), dash::obj(id(detail_level)),
               dash::obj(id(detail_level_max)), dash::obj(id(detail_dir_icon)), dash::obj(id(detail_dir)),
               dash::obj(id(detail_rpm)), dash::obj(id(detail_filter))},
              d.fan->state, d.level->state, d.direction->state, d.rpm->state, d.filter_days->state,
              d.filter_alarm->state);
  - id: refresh_chart
    then:
      - lambda: |-
          dash::render_chart({dash::obj(id(detail_chart_box)),
                              {dash::obj(id(detail_legend_0)), dash::obj(id(detail_legend_1)),
                               dash::obj(id(detail_legend_2)), dash::obj(id(detail_legend_3))},
                              dash::obj(id(detail_y_max)), dash::obj(id(detail_y_min)),
                              dash::obj(id(detail_chart_note)), dash::obj(id(detail_tab_vent)),
                              dash::obj(id(detail_tab_temp))});
  - id: fetch_history
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !dash::history_url().empty();'
          then:
            - lambda: |-
                // Keep showing an already loaded history of this unit while it refreshes
                if (dash::history.device != dash::selected || dash::history.state != dash::HistoryState::OK) {
                  dash::history.device = dash::selected;
                  dash::history.state = dash::HistoryState::LOADING;
                }
            - script.execute: refresh_chart
            - http_request.get:
                url: !lambda 'return dash::history_url();'
                capture_response: true
                max_response_buffer_size: 20000
                on_response:
                  then:
                    - lambda: 'dash::history_parse(dash::selected, response->status_code, body);'
                    - script.execute: refresh_chart
                on_error:
                  then:
                    - lambda: |-
                        dash::history.device = dash::selected;
                        dash::history.state = dash::HistoryState::FAILED;
                    - script.execute: refresh_chart
          else:
            - lambda: |-
                dash::history.device = dash::selected;
                dash::history.state = dash::HistoryState::FAILED;
            - script.execute: refresh_chart

  # ---------------- Room controls (sent to the room master) ----------------
  - id: refresh_controls
    then:
      - lambda: |-
          const int mode = dash::mode_index(id(ha_room_mode).state);
          lv_obj_t *buttons[5] = {dash::obj(id(detail_mode_0)), dash::obj(id(detail_mode_1)),
                                  dash::obj(id(detail_mode_2)), dash::obj(id(detail_mode_3)),
                                  dash::obj(id(detail_mode_4))};
          for (int i = 0; i < 5; i++)
            dash::set_checked(buttons[i], i == mode);

          const bool pending = id(pending_level) > 0;
          const float level = pending ? id(pending_level) : id(ha_room_level).state;
          dash::set_text(id(detail_ctl_level), dash::num(level, "%.0f"));
          dash::set_color(id(detail_ctl_level), pending ? dash::COL_ACCENT : dash::COL_TEXT);
          // In Smart-Automatik a level starts the room-wide override (VentoSync level button)
          dash::set_text(id(detail_ctl_caption),
                         mode == 0 ? "Stufe · übersteuert " + dash::num(id(ha_override_duration).state, "%.0f") + " min"
                                   : std::string("Stufe · ganzer Raum"));
          const float remaining = id(ha_override_remaining).state;
          dash::set_text(id(detail_override),
                         remaining > 0 ? "Übersteuerung noch " + dash::num(remaining, "%.0f") + " min" : std::string(""));
  - id: send_mode
    mode: restart
    parameters:
      mode_index: int
    then:
      - lambda: |-
          // Optimistic: mark the tapped mode until HA confirms it
          lv_obj_t *buttons[5] = {dash::obj(id(detail_mode_0)), dash::obj(id(detail_mode_1)),
                                  dash::obj(id(detail_mode_2)), dash::obj(id(detail_mode_3)),
                                  dash::obj(id(detail_mode_4))};
          for (int i = 0; i < 5; i++)
            dash::set_checked(buttons[i], i == mode_index);
      - homeassistant.action:
          action: select.select_option
          data:
            entity_id: select.${master_prefix}_luftermodus
            # Same order as dash::MODES (this lambda is generated before the includes)
            option: !lambda |-
              static const char *const MODES[5] = {"Smart-Automatik", "Wärmerückgewinnung", "Durchlüften",
                                                   "Stoßlüftung", "Aus"};
              return std::string(MODES[mode_index]);
      # Fall back to the HA state if the change was not applied
      - delay: 4s
      - script.execute: refresh_controls
  - id: change_level
    parameters:
      delta: int
    then:
      - lambda: |-
          const float current = id(ha_room_level).state;
          int base = id(pending_level) > 0 ? id(pending_level) : (std::isnan(current) ? 1 : (int) current);
          id(pending_level) = std::max(1, std::min(10, base + delta));
      - script.execute: refresh_controls
      - script.execute: send_level
  - id: send_level
    mode: restart
    then:
      # Collect fast taps into one change
      - delay: 700ms
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: number.${master_prefix}_lufter_intensitat
            value: !lambda 'return esphome::to_string(id(pending_level));'
      - delay: 4s
      - lambda: 'id(pending_level) = 0;'
      - script.execute: refresh_controls

  - id: refresh_local
    then:
      - lambda: |-
          dash::set_text(id(label_local_temp), dash::num(id(local_temp).state, "%.1f °C"));
          dash::set_text(id(label_local_hum), dash::num(id(local_hum).state, "%.0f %%"));
          dash::set_text(id(label_local_iaq), dash::num(id(local_iaq).state, "%.0f"));
          dash::set_text(id(label_local_summary),
                         dash::num(id(local_temp).state, "%.1f°") + " · " + dash::num(id(local_hum).state, "%.0f%%") +
                             " · IAQ " + dash::num(id(local_iaq).state, "%.0f"));
  - id: refresh_clock
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid())
            return;
          static const char *const DAYS[] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
          char buf[24];
          snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
          dash::set_text(id(label_time), buf);
          snprintf(buf, sizeof(buf), "%s %02d.%02d.", DAYS[(now.day_of_week - 1) % 7], now.day_of_month, now.month);
          dash::set_text(id(label_date), buf);

# ---------------------------------------------------------
# Display & Touch Konfiguration
# ---------------------------------------------------------
# Adafruit Qualia nutzt intern einen I2C Expander (TCA9554) für das SPI Init
# des ST7701S. Da ESPHome das Bitbanging über I2C-Expander für SPI-TFTs noch
# nicht nativ unterstützt, wird hier standard RGB-TFT deklariert.
# Die Initialisierung übernimmt qualia_init.h (on_boot).
display:
  - platform: rpi_dpi_rgb
    id: tft_display
    color_order: RGB
    dimensions:
      width: 320
      height: 820
    # Exact Pins for Adafruit Qualia ESP32-S3 RGB-666 Display
    pclk_frequency: 16MHz
    pclk_inverted: true
    hsync_pulse_width: 3
    hsync_back_porch: 251
    hsync_front_porch: 150
    vsync_pulse_width: 6
    vsync_back_porch: 90
    vsync_front_porch: 100
    de_pin: GPIO2
    hsync_pin: GPIO41
    vsync_pin: GPIO42
    pclk_pin: GPIO1
    data_pins:
      blue: [GPIO40, GPIO39, GPIO38, GPIO0, GPIO45]
      green: [GPIO48, GPIO47, GPIO21, GPIO14, GPIO13, GPIO12]
      red: [GPIO11, GPIO10, GPIO9, GPIO46, GPIO3]

touchscreen:
  - platform: ft63x6
    id: my_touch
    i2c_id: i2c_bus
    # No transform here: LVGL applies its own rotation to the touch coordinates.
    # We purposefully exclude the interrupt_pin because it resides on the PCA9554. 
    # ESPHome will poll the touch controller over I2C, avoiding any I2C bus contention 
    # with the custom qualia_init.h C++ display initialization routine.

packages:
  ui: !include dashboard_ui.yaml
  device_1: !include
    file: packages/ventosync_device.yaml
    vars: { index: 0, key: buero, title: "Büro", prefix: "${device_1_prefix}" }
  device_2: !include
    file: packages/ventosync_device.yaml
    vars: { index: 1, key: flur, title: "Flur", prefix: "${device_2_prefix}" }
  device_3: !include
    file: packages/ventosync_device.yaml
    vars: { index: 2, key: wohnraum, title: "Wohnraum", prefix: "${device_3_prefix}" }

# HA connection indicator in the header (values freeze while disconnected)
interval:
  # Refresh the history while a detail page is open (VentoSync closes a bucket every 5 min)
  - interval: 5min
    then:
      - if:
          condition:
            lambda: 'return dash::detail_open;'
          then:
            - script.execute: fetch_history
  - interval: 5s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: 'dash::set_color(id(label_ha), dash::COL_ACCENT);'
          else:
            - lambda: 'dash::set_color(id(label_ha), dash::COL_ALARM);'

safe_mode:
