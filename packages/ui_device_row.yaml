# System page row for one ventilation unit (page_system). Vars: key, title, y
obj:
  x: 8
  y: ${y}
  width: 804
  height: 52
  styles: row_style
  clickable: false
  scrollable: false
  widgets:
    - label:
        align: LEFT_MID
        text: "${title}"
        text_font: font_22
    - label:
        id: ${key}_sys_config
        align: LEFT_MID
        x: 150
        text: "--"
        text_font: font_18
        text_color: 0xA9B4C0
    - label:
        id: ${key}_sys_wifi
        align: RIGHT_MID
        x: -170
        text: "-- dBm"
        text_font: font_18
    - label:
        id: ${key}_sys_version
        align: RIGHT_MID
        text: "--"
        text_font: font_18
        text_color: 0xA9B4C0
