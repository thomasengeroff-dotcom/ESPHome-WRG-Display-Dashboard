# Card slot on page_main. Var: slot (0..2). dash::refresh_overview fills it with a unit
# of the current room page (position, name, values) or hides it.
# Tapping the card opens page_detail for that unit.
obj:
  id: slot${slot}_card
  x: 8
  y: 62
  width: 262
  height: 200
  styles: card_style
  scrollable: false
  pressed:
    bg_color: 0x1F2630
  on_click:
    - if:
        condition:
          lambda: 'return dash::slot_device[${slot}] >= 0;'
        then:
          - lambda: 'dash::selected = dash::slot_device[${slot}];'
          - script.execute: open_detail
  widgets:
    - label:
        id: slot${slot}_lbl_name
        align: TOP_LEFT
        text: ""
        text_font: font_28
    - label:
        id: slot${slot}_lbl_status
        align: TOP_RIGHT
        text: "\U000F0319"
        text_font: font_icon_32
        text_color: 0xA9B4C0
    # Flex row: "/10" follows the level whatever its width ("3", "10", "Aus")
    - obj:
        align: LEFT_MID
        y: 4
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        styles: bare_style
        clickable: false
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_cross: END
          pad_column: 6
        widgets:
          - label:
              id: slot${slot}_lbl_level
              text: "--"
              text_font: font_72
          - label:
              id: slot${slot}_lbl_level_max
              pad_bottom: 14
              text: ""
              text_font: font_22
              text_color: 0xA9B4C0
    - label:
        id: slot${slot}_lbl_dir_icon
        align: RIGHT_MID
        x: -14
        y: -12
        text: ""
        text_font: font_icon_56
    - label:
        id: slot${slot}_lbl_dir
        align: RIGHT_MID
        y: 34
        text: "--"
        text_font: font_22
        text_color: 0xA9B4C0
    - label:
        id: slot${slot}_lbl_rpm
        align: BOTTOM_LEFT
        text: "-- U/min"
        text_font: font_18
        text_color: 0xA9B4C0
    - label:
        id: slot${slot}_lbl_filter
        align: BOTTOM_RIGHT
        text: "Filter -- d"
        text_font: font_18
        text_color: 0xA9B4C0
